{% extends "base.html" %}
{% block title %}执行详情 · Mango Pytest{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/">项目</a><span>/</span><span>执行详情</span></div>
<section class="run-heading"><div><p class="eyebrow">RUN ID</p><h1 class="mono">{{ run_id }}</h1></div><div class="actions"><button id="cancel-button" class="button danger" onclick="cancelRun()">停止</button><button class="button secondary" onclick="rerun()">重新运行</button></div></section>
<div id="run-meta" class="meta-grid"></div>
<div class="result-grid"><div class="metric"><span>总计</span><strong id="total">0</strong></div><div class="metric success"><span>通过</span><strong id="passed">0</strong></div><div class="metric failure"><span>失败</span><strong id="failed">0</strong></div><div class="metric"><span>跳过</span><strong id="skipped">0</strong></div></div>
<section class="console-card"><div class="console-head"><span>实时日志</span><span id="stream-state" class="live">● 连接中</span></div><pre id="console-output">等待任务输出…</pre></section>
<section id="failure-section" class="hidden"><div class="section-title"><h2>失败详情</h2></div><div id="failures" class="failure-list"></div></section>
<section><div class="section-title"><h2>产物</h2></div><div id="artifacts" class="artifact-list"></div></section>
{% endblock %}
{% block scripts %}<script>window.runId={{ run_id|tojson }};document.addEventListener('DOMContentLoaded',loadRunDetail);</script>{% endblock %}
