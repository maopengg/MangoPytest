{% extends "base.html" %}
{% block title %}执行详情 · Mango Pytest{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/">项目</a><span>/</span><span>执行详情</span></div>
<section class="run-heading"><div><p class="eyebrow">RUN ID</p><h1 class="mono">{{ run_id }}</h1></div><div class="actions"><button id="cancel-button" class="button danger" onclick="cancelRun(this)">停止</button><button class="button secondary" onclick="rerun(this)">重新运行</button></div></section>
<div id="run-meta" class="meta-grid"></div>
<div class="report-anchor"><section class="report-shell">
  <div class="report-tabs"><button class="report-tab" data-tab="cases" onclick="switchRunTab('cases',this)">测试结果</button><button class="report-tab active" data-tab="log" onclick="switchRunTab('log',this)">实时日志</button><button class="report-tab" data-tab="artifacts" onclick="switchRunTab('artifacts',this)">全部产物</button></div>
  <div id="tab-cases" class="run-tab">
    <div id="allure-overview" class="allure-overview"></div>
    <div class="allure-layout">
      <aside class="allure-sidebar"><div class="allure-filter"><input id="allure-search" placeholder="搜索用例" oninput="filterAllureCases()"><select id="allure-status" onchange="filterAllureCases()"><option value="">全部状态</option><option value="failed">失败</option><option value="broken">异常</option><option value="passed">通过</option><option value="skipped">跳过</option></select><select id="allure-group-mode" class="allure-group-mode" aria-label="用例分组方式" onchange="filterAllureCases()"><option value="behavior" selected>业务层级 · 项目 / Epic / Feature / Story</option><option value="suite">文件层级 · 目录 / 测试文件</option></select></div><div id="allure-case-list" class="allure-case-list"></div></aside>
      <article id="allure-case-detail" class="allure-case-detail"><div class="empty">执行完成后显示结构化 Allure 结果</div></article>
    </div>
  </div>
  <div id="tab-log" class="run-tab active"><section class="console-card"><div class="console-head"><span>pytest 实时输出</span><span id="stream-state" class="live">● 连接中</span></div><pre id="console-output">等待任务输出…</pre></section></div>
  <div id="tab-artifacts" class="run-tab"><div id="artifacts" class="artifact-list"></div></div>
</section></div>
<button id="back-to-top" class="back-to-top" type="button" aria-label="返回页面顶部" title="返回顶部" onclick="scrollRunToTop()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg></button>
{% endblock %}
{% block scripts %}<script>window.runId={{ run_id|tojson }};document.addEventListener('DOMContentLoaded',loadRunDetail);</script>{% endblock %}
