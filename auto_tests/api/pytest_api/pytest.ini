[pytest]
python_files = test_*.py
testpaths = test_cases
markers =
    smoke: 冒烟测试
    positive: 正向测试
    negative: 负向测试
    boundary: 边界值测试
    security: 安全测试
    auth: 认证测试
    integration: 集成测试
    cross_protocol: 跨协议测试
    websocket: WebSocket 测试
    mcp: MCP 测试
    grpc: gRPC 测试
    sse: SSE 测试
    http: HTTP 测试
    webhook: Webhook 测试
addopts = -v --tb=short --strict-markers
