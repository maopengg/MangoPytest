syntax = "proto3";

package mango.mock.v1;

service ApprovalService {
  rpc CreateClaim(CreateClaimRequest) returns (ClaimReply);
  rpc ActClaim(ActClaimRequest) returns (ClaimReply);
  rpc GetClaim(GetClaimRequest) returns (ClaimReply);
}

service ReviewService {
  rpc StartReview(StartReviewRequest) returns (ReviewReply);
  rpc GetReview(GetReviewRequest) returns (ReviewReply);
  rpc WatchReview(GetReviewRequest) returns (stream ReviewReply);
}

service TestLabService {
  rpc UnaryEcho(EchoRequest) returns (EchoReply);
  rpc ServerStream(StreamRequest) returns (stream StreamItem);
  rpc ClientStream(stream StreamItem) returns (StreamSummary);
  rpc BidirectionalChat(stream ChatMessage) returns (stream ChatMessage);
  rpc Fail(FailRequest) returns (EchoReply);
  rpc Delay(DelayRequest) returns (EchoReply);
  rpc VersionedContract(ContractVersionRequest) returns (ContractVersionReply);
}

message CreateClaimRequest { double amount = 1; string reason = 2; }
message ActClaimRequest { int64 claim_id = 1; string decision = 2; string comment = 3; }
message GetClaimRequest { int64 claim_id = 1; }
message ClaimReply {
  int64 claim_id = 1;
  string claim_no = 2;
  string status = 3;
  string current_stage = 4;
  string json_data = 5;
}

message StartReviewRequest {
  string contract_name = 1;
  int32 duration_seconds = 2;
  int32 expected_risk_count = 3;
}
message GetReviewRequest { int64 job_id = 1; int32 interval_ms = 2; }
message ReviewReply {
  int64 job_id = 1;
  string job_no = 2;
  string status = 3;
  int32 progress = 4;
  string json_data = 5;
}

message EchoRequest {
  string text = 1;
  int64 integer = 2;
  double number = 3;
  bool boolean = 4;
  repeated string items = 5;
  map<string, string> attributes = 6;
}

message EchoReply {
  EchoRequest value = 1;
  map<string, string> metadata = 2;
}

message StreamRequest {
  int32 count = 1;
  int32 interval_ms = 2;
  int32 fail_at = 3;
}

message StreamItem {
  int32 index = 1;
  string value = 2;
}

message StreamSummary {
  int32 count = 1;
  repeated string values = 2;
}

message ChatMessage {
  string sender = 1;
  string message = 2;
  int64 sequence = 3;
}

message FailRequest {
  string status_code = 1;
  string message = 2;
}

message DelayRequest {
  double seconds = 1;
  string value = 2;
}

message ContractVersionRequest {
  int32 version = 1;
}

message ContractVersionReply {
  int32 schema_version = 1;
  string json_data = 2;
}
