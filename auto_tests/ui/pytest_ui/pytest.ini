[pytest]
python_files = test_*.py
testpaths = test_cases
markers =
    smoke: 冒烟测试
    ui: UI 自动化测试
    positive: 正向测试场景
    negative: 负向测试场景
    order: 订单业务场景
    claim: 报销审批场景
    review: 合同评审场景
    capability: mangoautomation 能力验证
    p0: P0 核心优先级
    p1: P1 重要优先级
    p2: P2 一般优先级
    architecture: 项目架构和元素 Schema 门禁
    ai_heal: 元素自愈 / AI 定位靶场用例（AI 默认关闭，用 -m ai_heal 定向执行）
addopts = -v --tb=short --strict-markers -p core.execution.pytest_evidence_plugin
